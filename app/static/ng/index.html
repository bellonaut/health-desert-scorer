<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Nigeria Dashboard</title>
<meta http-equiv="refresh" content="0; url=/health_desert_ui.html">
<script>
(function redirectToNigeriaDashboard() {
  var sourceUrl = new URL(window.location.href);
  var targetUrl = new URL("/health_desert_ui.html", window.location.origin);

  sourceUrl.searchParams.forEach(function (value, key) {
    targetUrl.searchParams.set(key, value);
  });

  if (sourceUrl.hash) {
    targetUrl.hash = sourceUrl.hash;
  }

  window.location.replace(targetUrl.toString());
})();
</script>
</head>
<body>
<p>Redirecting to Nigeria dashboard...</p>
<p><a href="/health_desert_ui.html">Continue</a></p>
</body>
</html>
