<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Nigeria Dashboard</title>
<meta http-equiv="refresh" content="0; url=https://bashir-healthdesert.streamlit.app/?app=ng">
<script>
(function redirectToNigeriaDashboard() {
  var sourceUrl = new URL(window.location.href);
  var targetUrl = new URL("https://bashir-healthdesert.streamlit.app/");
  targetUrl.searchParams.set("app", "ng");

  sourceUrl.searchParams.forEach(function (value, key) {
    if (key !== "app") {
      targetUrl.searchParams.set(key, value);
    }
  });

  if (sourceUrl.hash) {
    targetUrl.hash = sourceUrl.hash;
  }

  window.location.replace(targetUrl.toString());
})();
</script>
</head>
<body>
<p>Redirecting to Nigeria dashboard...</p>
<p><a href="https://bashir-healthdesert.streamlit.app/?app=ng">Continue</a></p>
</body>
</html>
